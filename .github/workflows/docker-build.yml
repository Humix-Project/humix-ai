name: Build and Push Docker Image

on:
  push:
    paths:
      # 아래 파일이 변경된 경우에만 빌드 실행 (불필요한 빌드 방지)
      - 'app.py'
      - 'handler.py'
      - 'vector_processor.py'
      - 'vector_service.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      BUILD_TARGET: ${{ (github.ref_name == 'main' || github.ref_name == 'feat/musicgen-integration') && 'runtime' || 'smoke' }}

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정 (linux/amd64 크로스 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 이미지 메타데이터 생성 (태그: latest + git sha 단축키)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/humix-ai
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=ref,event=branch
            type=sha,prefix=,format=short

      # 5. 빌드 & Docker Hub에 Push
      #    - linux/amd64: RunPod 서버(x86_64 Linux)에서 실행 가능한 이미지 빌드
      #    - cache-from/to: GitHub Actions 캐시를 활용해 재빌드 시 모델 다운로드 생략
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          target: ${{ env.BUILD_TARGET }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
