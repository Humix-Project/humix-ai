name: Run AI API Functional Tests

on:
  workflow_dispatch:
    inputs:
      ai_server_url:
        description: 'RunPod AI Server URL (e.g., https://<pod-id>-8000.proxy.runpod.net)'
        required: true
        default: 'https://xwu92nte3h7pdq-8000.proxy.runpod.net'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install only the minimal required libraries for test runner
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3

      # 4. Run API Tests
      - name: Run API Tests
        env:
          AI_SERVER_URL: ${{ github.event.inputs.ai_server_url }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'aws-humix-server-s3' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python test_runner.py
